services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - "./database:/app/database"
      - "./public/uploads:/app/public/uploads"
      - "./public/tmp:/app/public/tmp"
    environment:
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:${APP_PORT:-8080}}"
      APP_MAIL_FROM: "${APP_MAIL_FROM:-camagru@example.com}"
      APP_MAIL_REPLY_TO: "${APP_MAIL_REPLY_TO:-}"
      # Set to service name `mailpit` when using: docker compose --profile mail up
      MAILPIT_HOST: "${MAILPIT_HOST:-}"

  # Optional: captures outbound SMTP from the app (PHP mail → msmtp → Mailpit).
  # Image: https://hub.docker.com/r/axllent/mailpit
  # UI: http://localhost:${MAILPIT_UI_PORT:-8025}
  mailpit:
    image: axllent/mailpit:v1.22
    profiles:
      - mail
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
